; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = 
  pio_addr2line.ini

[esp32_common]
	platform = espressif32
	framework = arduino
	upload_speed = 921600
	monitor_speed = 115200
	build_type = release
	build_flags = 
		-D RFS_USE_SPIFFS
		-D LOG_MULTITHREADED
		-D LOG_ERROR_ENABLED
		-D LOG_WARN_ENABLED
		-D LOG_INFO_ENABLED
	lib_extra_dirs = 
   		./lib/io
   		./lib/system
   		./lib/net
   		./lib/web
	extra_scdbgripts =
		post:pio_addr2line.py
	lib_deps =
		lib_http_server
		lib_settings
		lib_net
		Preferences
		esphome/ESPAsyncWebServer-esphome @ ^3.2.0
		bblanchon/ArduinoJson @ ^7.0.4
		ropg/ezTime @ ^0.8.3
	test_framework = unity
	
[esp32_common_dbg]
	extends = esp32_common
;	debug build not required without debugger
;	build_type = debug
	build_flags = 
		${esp32_common.build_flags}
		-D LOG_WEB_DBG_ENABLED
		-D LOG_WIFI_DBG_ENABLED
		-D LOG_DEBUG_ENABLED
		-D LOG_MSG_ENABLED
		-D TASK_INFO_ENABLED
		-D CONFIG_FREERTOS_USE_TRACE_FACILITY
		-D CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS
		-D CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS
		-D CONFIG_FREERTOS_VTASKLIST_INCLUDE_COREID

[env:wemos_d1_mini32_rel]
	board = wemos_d1_mini32
	extends = esp32_common

[env:wemos_d1_mini32_dbg]
	board = wemos_d1_mini32
	extends = esp32_common_dbg

